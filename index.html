<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>
    <div class="dashboard">
        <!-- Greeting Widget -->
        <section class="widget greeting-widget">
            <div class="greeting-header">
                <div id="greeting-text"></div>
                <button id="edit-name-btn" class="edit-name-btn hidden" title="Edit name">✏️</button>
            </div>
            <div id="current-time"></div>
            <div id="current-date"></div>
            <div class="name-input-container" id="name-input-container">
                <input type="text" id="name-input" placeholder="Enter your name...">
                <button id="save-name-btn">Save Name</button>
            </div>
        </section>

        <!-- Focus Timer Widget -->
        <section class="widget timer-widget">
            <h2>Focus Timer</h2>
            <div id="timer-display">25:00</div>
            <div class="timer-controls">
                <button id="timer-start">Start</button>
                <button id="timer-stop">Stop</button>
                <button id="timer-reset">Reset</button>
            </div>
            <div id="timer-complete" class="hidden">Session Complete!</div>
        </section>

        <!-- To-Do List Widget -->
        <section class="widget todo-widget">
            <h2>To-Do List</h2>
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="Add a new task...">
                <button type="submit">Add</button>
            </form>
            <ul id="todo-list"></ul>
        </section>

        <!-- Quick Links Widget -->
        <section class="widget links-widget">
            <h2>Quick Links</h2>
            <form id="links-form">
                <input type="text" id="link-label" placeholder="Label">
                <input type="text" id="link-url" placeholder="URL">
                <button type="submit">Add Link</button>
            </form>
            <div id="links-container"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
